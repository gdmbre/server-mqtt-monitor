[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "server-mqtt-monitor"
version = "0.1.0"
description = "Small configurable Linux server monitor that publishes metrics and warnings to MQTT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0,<3",
    "psutil>=5.9,<8",
]

[project.scripts]
server-monitor = "server_monitor.__main__:main"

[tool.setuptools.packages.find]
include = ["server_monitor*"]
